name: Bug report
description: Create a report to help us improve
body:
  - type: textarea
    id: describe-the-bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: to-reproduce
    attributes:
      label: To Reproduce
      description: 'Steps to reproduce the behavior'
      value: |
        1. Configure the client and authenticator '...'
        2. Start the authorization or token request '...'
        3. Follow the authentication, consent or token flow '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: textarea
    id: environment-information
    attributes:
      label: Environment information (if available)
      description: Please complete the lines that apply.
      value: |
        - wallet-as version, commit, or image tag:
        - Deployment method: [Docker / source]
        - Node version (if running from source):
        - Server OS:
        - Valkey version (if applicable):
        - Authenticator: [user-pass-pid / auth-broker / custom]
        - OAuth/OIDC flow or grant type:
        - wallet-issuer version or commit (if applicable):
        - Device and OS (if applicable):
        - Browser and version (if applicable):

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
